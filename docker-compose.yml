version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: produto-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: produto-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
